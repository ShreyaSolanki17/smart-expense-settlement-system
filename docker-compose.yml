services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: money_split
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: money_split
      RABBITMQ_DEFAULT_PASS: money_split
    ports:
      - "5672:5672"   # AMQP (broker traffic)
      - "15672:15672" # management UI, http://localhost:15672

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/money_split
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://money_split:money_split@rabbitmq:5672//
    depends_on:
      - db
      - redis
      - rabbitmq

  worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/money_split
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://money_split:money_split@rabbitmq:5672//
    depends_on:
      - db
      - redis
      - rabbitmq

volumes:
  postgres_data:
