apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: money-split-web:local
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "-l", "info"]
          envFrom:
            - configMapRef: {name: money-split-config}
            - secretRef: {name: money-split-secrets}
