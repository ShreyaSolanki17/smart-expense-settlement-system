# ponytail: migration runs as an initContainer, not a separate Job — one
# fewer resource to track, and it naturally blocks the app container until
# the schema is current.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      initContainers:
        - name: migrate
          image: money-split-web:local
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: {name: money-split-config}
            - secretRef: {name: money-split-secrets}
      containers:
        - name: web
          image: money-split-web:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: money-split-config}
            - secretRef: {name: money-split-secrets}
          readinessProbe:
            httpGet: {path: /admin/login/, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports: [{port: 8000}]
