# ponytail: plaintext dev secrets for a local cluster only, mirrors the
# postgres/postgres creds already in docker-compose.yml. Swap for a real
# secret manager before this ever points at a cloud cluster.
apiVersion: v1
kind: Secret
metadata:
  name: money-split-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  DJANGO_SECRET_KEY: dev-only-not-a-real-secret-change-me
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/money_split
  REDIS_URL: redis://redis:6379/0
